<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="title">
<title id="title">Adaptive PINN training feedback loop</title>
<defs>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67f8ca"/><stop offset="1" stop-color="#a590ff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173434"/><stop offset="1" stop-color="#0c101c"/></linearGradient>
  <radialGradient id="light"><stop stop-color="#67f8ca" stop-opacity=".26"/><stop offset="1" stop-color="#67f8ca" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .label{font:600 18px system-ui,sans-serif;fill:#eff3ff}
  .fine{font:500 14px system-ui,sans-serif;fill:#bfc7dd}
  .pulse{stroke-dasharray:4 14;animation:flow 2.7s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-36}}
  @media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<ellipse cx="320" cy="200" rx="268" ry="188" fill="url(#light)" /><path d="M168 134Q319 37 472 134M485 176Q520 303 345 329M294 329Q112 303 155 175" fill="none" stroke="#8bbed7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".58"/><path d="M168 134Q319 37 472 134M485 176Q520 303 345 329M294 329Q112 303 155 175" fill="none" stroke="#d9fffd" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="pulse" opacity=".88"/><rect x="111" y="118" width="112" height="48" rx="14" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><text x="167" y="149" text-anchor="middle" class="fine">Policy</text><rect x="416" y="118" width="112" height="48" rx="14" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><text x="472" y="149" text-anchor="middle" class="fine">Action</text><rect x="263" y="302" width="112" height="48" rx="14" fill="url(#panel)" stroke="url(#ink)" stroke-opacity=".66" opacity="1"/><text x="319" y="333" text-anchor="middle" class="fine">State</text><ellipse cx="320" cy="217" rx="103" ry="56" fill="none" stroke="url(#ink)" opacity=".65"/><path d="M229 225c37 8 57-56 89-43 34 14 48 56 87 17" fill="none" stroke="url(#ink)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
