"round" /><path d="M135 168H276" fill="none" stroke="#24364b" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 164C163 154 181 103 210 127S249 164 270 106" fill="none" stroke="#637086" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" /><path d="M139 164C163 154 181 103 210 127S249 164 270 106" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pinn-solver-trace" /><circle cx="139" cy="164" r="3" fill="#2effbf" class="pinn-boundary" /><circle cx="270" cy="106" r="3" fill="#2effbf" class="pinn-boundary" /><text x="160" y="224" font-size="12" style="fill:#a9c3cc" text-anchor="middle">Publish · Version · Reuse</text></g></g></svg>
