<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title"><title id="title">Zinging</title><defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f" /><stop offset=".55" stop-color="#080d16" /><stop offset="1" stop-color="#141126" /></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65" /><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15" /><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65" /></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18" /><stop offset="1" stop-color="#2effbf" stop-opacity="0" /></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18" /><stop offset="1" stop-color="#b9a7ff" stop-opacity="0" /></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.zing-evolution{stroke-dasharray:25 415;animation:zingEvolution 8s linear infinite}.zing-stage{animation:zingStage 4s ease-in-out infinite}@keyframes zingEvolution{to{stroke-dashoffset:-440}}@keyframes zingStage{0%,100%{opacity:.25}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(20 0)"><g data-project-scene="true"><text x="160" y="17" font-size="11" style="fill:#b4c8cf" text-anchor="middle">SELF-EVOLVING BOT</text><ellipse cx="160" cy="118" rx="94" ry="91" fill="url(#mint-glow)" /><circle cx="160" cy="118" r="70" fill="none" stroke="#34534e" stroke-width="1.4" /><circle class="zing-evolution" cx="160" cy="118" r="70" fill="none" stroke="#2effbf" stroke-width="2.4" stroke-linecap="round" /><path d="M228 110 230 118 236 112M168 186 160 188 166 194M92 126 90 118 84 124M152 50 160 48 154 42" fill="none" stroke="#75b6a5" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="160" cy="48" r="3" fill="#2effbf" class="zing-stage" style="animation-delay:-0s" /><circle cx="230" cy="118" r="3" fill="#2effbf" class="zing-stage" style="animation-delay:-1s" /><circle cx="160" cy="188" r="3" fill="#2effbf" class="zing-stage" style="animation-delay:-2s" /><circle cx="90" cy="118" r="3" fill="#2effbf" class="zing-stage" style="animation-delay:-3s" /><rect x="126" y="92" width="68" height="54" rx="9" fill="#152b2c" stroke="#83c9b6" /><path d="M120 103H126M120 118H126M120 133H126M194 103H200M194 118H200M194 133H200M142 86V92M160 86V92M178 86V92M142 146V152M160 146V152M178 146V152" fill="none" stroke="#5f938b" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /><text x="160" y="116" font-size="18" style="fill:#2effbf" text-anchor="middle">BOT</text><text x="160" y="136" font-size="13" style="fill:#b9a7ff" text-anchor="middle">&lt;/&gt;</text><text x="160" y="37" font-size="12" style="fill:#b9a7ff" text-anchor="middle">Plan</text><text x="273" y="122" font-size="12" style="fill:#d5e1ed" text-anchor="middle">Code</text><text x="160" y="212" font-size="12" style="fill:#2effbf" text-anchor="middle">Verify</text><text x="47" y="122" font-size="12" style="fill:#d5e1ed" text-anchor="middle">Learn</text></g></g></svg>
