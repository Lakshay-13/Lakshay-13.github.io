<svg xmlns="http://www.w3.org/2000/svg" width="360" height="240" viewBox="0 0 360 240" role="img" aria-labelledby="title"><title id="title">Tree</title><defs>
<linearGradient id="surface" x2="1" y2="1"><stop stop-color="#07110f" /><stop offset=".55" stop-color="#080d16" /><stop offset="1" stop-color="#141126" /></linearGradient>
<linearGradient id="edge"><stop stop-color="#2effbf" stop-opacity=".65" /><stop offset=".55" stop-color="#b9a7ff" stop-opacity=".15" /><stop offset="1" stop-color="#b9a7ff" stop-opacity=".65" /></linearGradient>
<radialGradient id="mint-glow"><stop stop-color="#2effbf" stop-opacity=".18" /><stop offset="1" stop-color="#2effbf" stop-opacity="0" /></radialGradient>
<radialGradient id="purple-glow"><stop stop-color="#b9a7ff" stop-opacity=".18" /><stop offset="1" stop-color="#b9a7ff" stop-opacity="0" /></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" /></filter>

</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f4f7fb}
.mono{font-family:'Courier New',monospace}
.muted{fill:#aab3c0}.soft{fill:#7d8d9b}
.flow{stroke-dasharray:12 160;animation:flow 8s linear infinite}
.dash{stroke-dasharray:3 9;animation:dash 8s linear infinite}
.float{animation:float 8s ease-in-out infinite}
.breath{animation:breath 4s ease-in-out infinite}
.glint{animation:glint 4s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 24s linear infinite}
.signal{animation:signal 4s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
.drift{animation:drift 8s ease-in-out infinite}
.meter{transform-box:fill-box;transform-origin:bottom;animation:meter 4s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-688}}
@keyframes dash{to{stroke-dashoffset:-96}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes breath{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes glint{0%,100%{opacity:.18}50%{opacity:.9}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes signal{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,-12px)}}
@keyframes meter{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:.75}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.tree-branch{animation:treeBranch 8s ease-in-out infinite}@keyframes treeBranch{0%,14%,100%{opacity:.2;transform:translateY(-6px)}35%,78%{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><g transform="translate(20 0)"><g data-project-scene="true"><path d="M159 60V105M59 139V105H259V139M99 187V163H219V187" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="124" y="14" width="70" height="48" rx="14" fill="#253041" stroke="#b9a7ff" /><circle cx="159" cy="32" r="7" fill="#b9a7ff" /><path d="M145 51Q159 36 173 51" fill="none" stroke="#b9a7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><g class="tree-branch" style="animation-delay:-0.0s"><rect x="28" y="138" width="62" height="30" rx="10" fill="#15332b" stroke="#2effbf" /><circle cx="41" cy="153" r="4" fill="#2effbf" /><path d="M53 153H76" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="tree-branch" style="animation-delay:-1.1s"><rect x="228" y="138" width="62" height="30" rx="10" fill="#15332b" stroke="#2effbf" /><circle cx="241" cy="153" r="4" fill="#2effbf" /><path d="M253 153H276" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="tree-branch" style="animation-delay:-2.2s"><rect x="128" y="111" width="62" height="30" rx="10" fill="#15332b" stroke="#2effbf" /><circle cx="141" cy="126" r="4" fill="#2effbf" /><path d="M153 126H176" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="tree-branch" style="animation-delay:-3.3000000000000003s"><rect x="69" y="187" width="62" height="30" rx="10" fill="#15332b" stroke="#2effbf" /><circle cx="82" cy="202" r="4" fill="#2effbf" /><path d="M94 202H117" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><g class="tree-branch" style="animation-delay:-4.4s"><rect x="189" y="187" width="62" height="30" rx="10" fill="#15332b" stroke="#2effbf" /><circle cx="202" cy="202" r="4" fill="#2effbf" /><path d="M214 202H237" fill="none" stroke="#3c5064" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g></g></g></svg>
